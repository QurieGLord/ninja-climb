<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b2028" />
    <meta name="description" content="Ninja Climb — путь ниндзя сквозь облака. Прыгай, атакуй в воздухе и покори небесный храм." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Ninja Climb — Путь в облака</title>
    <script>
      // This stays inline: the retry screen must work even if the bundle/CSS fails.
      window.addEventListener('error', function (event) {
        const target = event.target;
        if (!(target instanceof HTMLScriptElement && target.type === 'module') && !(target instanceof HTMLLinkElement && target.rel === 'stylesheet')) return;
        function showError() {
          if (document.getElementById('critical-load-error')) return;
          const panel = document.createElement('div');
          panel.id = 'critical-load-error';
          panel.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:grid;place-content:center;gap:20px;text-align:center;background:#15313c;color:#e6e7d7;font:16px Arial;padding:30px';
          panel.innerHTML = '<span style="color:#ec7967;font:48px serif">忍</span><p>Не удалось загрузить игру. Проверь соединение.</p><button id="critical-retry" style="padding:18px;border:0;border-radius:8px;background:#ec7967;color:#18333a;font:16px Arial;cursor:pointer">Повторить загрузку</button>';
          panel.querySelector('button').onclick = function () { location.reload(); };
          document.body.append(panel);
        }
        if (document.body) showError(); else document.addEventListener('DOMContentLoaded', showError, { once: true });
      }, true);
    </script>
  </head>
  <body>
    <div id="app"><div style="position:fixed;inset:0;display:grid;place-content:center;gap:20px;text-align:center;background:#15313c;color:#e6e7d7;font:16px Arial;padding:30px"><span style="color:#ec7967;font:48px serif">忍</span><p>Пробуждаем небесный храм…</p></div></div>
    <noscript>Для игры нужен JavaScript. Включите его в настройках браузера.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
